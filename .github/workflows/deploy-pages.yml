name: Deploy site to GitHub Pages

# Builds the playable site from the authoring sources and publishes dist/ to
# GitHub Pages. The Vite config uses a relative base ('./'), so the same build
# works both at a domain root and under the /<repo>/ project path.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build story sources, type-check and bundle
        run: npm run build

      - name: Verify all unit and editorial contracts before publishing
        run: npm test

      - name: Require reproducible story artifacts
        run: git diff --exit-code -- story src/generated

      - name: Report build output
        run: |
          echo "dist files: $(find dist -type f | wc -l)"
          echo "dist size : $(du -sh dist | cut -f1)"
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -f dist/offline-manifest.json || { echo "offline manifest missing"; exit 1; }

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
